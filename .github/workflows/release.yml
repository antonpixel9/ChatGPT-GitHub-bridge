name: Publish Obsidian plugin release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - main.js
      - styles.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate plugin and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node --check main.js
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!m.id || !/^\d+\.\d+\.\d+$/.test(m.version) || m.isDesktopOnly !== false) throw Error('Invalid mobile plugin manifest');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + m.version + '\n');
          NODE
      - name: Check release assets
        run: |
          test -s main.js
          test -s manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(main.js manifest.json)
          if [ -f styles.css ]; then assets+=(styles.css); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting published assets."
            exit 0
          fi
          gh release create "$TAG" "${assets[@]}" --title "ChatGPT GitHub Bridge $TAG" --notes "Obsidian plugin release $TAG" --target "$GITHUB_SHA"
